components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ll_session
      description: HttpOnly, SameSite=Lax session cookie set by POST /api/v1/auth/login.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Must equal the ll_csrf cookie on every non-GET /api/* request except /api/v1/ingest*.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: llk_<prefix>_<secret>
      description: Ingestion API key created via POST /api/v1/api-keys.
  schemas:
    Envelope:
      type: object
      description: Every response uses this envelope.
      required:
        - data
        - error
      properties:
        data: {}
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Error'
        meta:
          type: object
          additionalProperties: true
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - FORBIDDEN
            - CSRF_INVALID
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - PAYLOAD_TOO_LARGE
            - QUERY_INVALID
            - QUERY_TIMEOUT
            - QUERY_FAILED
            - NOT_IMPLEMENTED
            - INTERNAL
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
    ListMeta:
      type: object
      properties:
        total:
          type: integer
        nextCursor:
          type:
            - string
            - 'null'
          description: Keyset cursor (LG-139)
    Span:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
      description: Character offsets in the query (end exclusive).
    LensQLError:
      type: object
      required:
        - code
        - message
        - span
      properties:
        code:
          enum:
            - LEX_ERROR
            - PARSE_ERROR
            - SEMANTIC_ERROR
            - LIMIT_EXCEEDED
            - TIME_RANGE_ERROR
        message:
          type: string
        span:
          $ref: '#/components/schemas/Span'
    Role:
      type: string
      enum:
        - owner
        - admin
        - member
        - viewer
    Permission:
      type: string
      enum:
        - search:read
        - search:save
        - ingest:keys:read
        - ingest:keys:manage
        - audit:read
        - org:manage
        - members:manage
        - alerts:manage
        - dashboards:manage
        - pipelines:manage
        - retention:manage
    RegisterRequest:
      type: object
      required:
        - organizationName
        - name
        - email
        - password
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 256
    Me:
      type: object
      required:
        - id
        - email
        - name
        - organization
        - role
        - permissions
      properties:
        id: &id004
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        organization:
          type: object
          properties:
            id: *id004
            name:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    CreateApiKeyRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        defaultService:
          type: string
          minLength: 1
          maxLength: 120
    ApiKey:
      type: object
      required:
        - id
        - name
        - prefix
        - createdAt
      properties:
        id: *id004
        name:
          type: string
        prefix:
          type: string
          pattern: ^[A-Za-z0-9]{8}$
        defaultService:
          type:
            - string
            - 'null'
        createdAt: &id005
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              pattern: ^llk_[A-Za-z0-9]{8}_[A-Za-z0-9_-]{43}$
              description: Shown once; only its SHA-256 is stored.
    RawEvent:
      type: object
      additionalProperties: true
      description: One log record. Unknown keys are kept as attributes (<= 16 KiB, depth <= 8).
      properties:
        timestamp:
          oneOf:
            - type: string
            - type: number
          description: ISO-8601, epoch seconds or epoch milliseconds (aliases @timestamp, time, ts)
        level:
          oneOf:
            - type: string
            - type: number
          description: Aliases severity, lvl; pino numeric levels accepted
        service:
          type: string
        host:
          type: string
        source:
          type: string
        message:
          type: string
          maxLength: 32768
        trace_id:
          type: string
    IngestResult:
      type: object
      required:
        - accepted
        - rejectedCount
        - rejected
      properties:
        accepted:
          type: integer
        rejectedCount:
          type: integer
        rejected:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              line:
                type: integer
              reason:
                type: string
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 4000
          default: ''
        from: *id005
        to: *id005
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Default event limit (100) when the query has no head
    SearchColumn:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          enum:
            - time
            - text
            - number
    SearchResponse:
      type: object
      required:
        - mode
        - columns
        - rows
        - range
        - stats
      properties:
        mode:
          enum:
            - events
            - table
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SearchColumn'
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        range:
          type: object
          properties:
            from: *id005
            to: *id005
        stats:
          type: object
          properties:
            rowCount:
              type: integer
            limit:
              type: integer
            truncated:
              type: boolean
            elapsedMs:
              type: integer
    HistogramRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 4000
          default: ''
        from: *id005
        to: *id005
        buckets:
          type: integer
          minimum: 1
          maximum: 500
          default: 60
    HistogramResponse:
      type: object
      required:
        - bucketSeconds
        - buckets
        - total
        - range
      properties:
        bucketSeconds:
          type: integer
        buckets:
          type: array
          items:
            type: object
            properties:
              start: *id005
              count:
                type: integer
        total:
          type: integer
        range:
          type: object
          properties:
            from: *id005
            to: *id005
    ValidateResponse:
      oneOf:
        - type: object
          required:
            - valid
            - mode
            - commands
          properties:
            valid:
              const: true
            mode:
              enum:
                - events
                - table
            commands:
              type: array
              items:
                enum:
                  - stats
                  - sort
                  - head
                  - fields
                  - where
        - type: object
          required:
            - valid
            - error
          properties:
            valid:
              const: false
            error:
              $ref: '#/components/schemas/LensQLError'
    Organization:
      type: object
      properties:
        id: *id004
        name:
          type: string
        slug:
          type: string
        createdAt: *id005
    Member:
      type: object
      properties:
        userId: *id004
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt: *id005
    Invitation:
      type: object
      properties:
        id: *id004
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt: *id005
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        actorUserId:
          type:
            - string
            - 'null'
        targetType:
          type:
            - string
            - 'null'
        targetId:
          type:
            - string
            - 'null'
        metadata:
          type: object
        ip:
          type:
            - string
            - 'null'
        requestId:
          type:
            - string
            - 'null'
        createdAt: *id005
    IngestQuota:
      type: object
      properties:
        maxEventsPerDay:
          type: integer
        maxBytesPerDay:
          type: integer
        usedEventsToday:
          type: integer
        usedBytesToday:
          type: integer
    Pipeline:
      type: object
      required:
        - name
        - processors
      properties:
        id: *id004
        name:
          type: string
        match:
          type: string
          description: LensQL filter selecting events
        enabled:
          type: boolean
        processors:
          type: array
          items:
            type: object
            properties:
              kind:
                enum:
                  - grok
                  - rename
                  - drop
                  - coerce
              config:
                type: object
    FieldInfo:
      type: object
      properties:
        name:
          type: string
        types:
          type: array
          items:
            enum:
              - string
              - number
              - boolean
              - object
              - array
        approxDistinct:
          type: integer
        sampleValues:
          type: array
          items: {}
    SavedSearchInput:
      type: object
      required:
        - name
        - query
      properties:
        name:
          type: string
          maxLength: 120
        query:
          type: string
          maxLength: 4000
        timePreset:
          enum:
            - 15m
            - 1h
            - 4h
            - 24h
            - 7d
        visibility:
          enum:
            - private
            - org
    SavedSearch:
      allOf:
        - $ref: '#/components/schemas/SavedSearchInput'
        - type: object
          properties:
            id: *id004
            ownerId: *id004
            createdAt: *id005
            updatedAt: *id005
    DashboardInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        variables:
          type: object
        layout:
          type: object
    Dashboard:
      allOf:
        - $ref: '#/components/schemas/DashboardInput'
        - type: object
          properties:
            id: *id004
            panels:
              type: array
              items:
                $ref: '#/components/schemas/Panel'
            updatedAt: *id005
    PanelInput:
      type: object
      required:
        - title
        - query
        - chart
      properties:
        title:
          type: string
        query:
          type: string
          description: LensQL with | stats ... span=...
        chart:
          enum:
            - line
            - area
            - bar
            - table
        savedSearchId: *id004
        position:
          type: object
          properties:
            x:
              type: integer
            y:
              type: integer
            w:
              type: integer
            h:
              type: integer
    Panel:
      allOf:
        - $ref: '#/components/schemas/PanelInput'
        - type: object
          properties:
            id: *id004
    AlertRuleInput:
      type: object
      required:
        - name
        - query
        - kind
        - every
      properties:
        name:
          type: string
        query:
          type: string
        kind:
          enum:
            - threshold
            - ewma
        condition:
          type: object
          properties:
            column:
              type: string
            op:
              enum:
                - '>'
                - '>='
                - <
                - <=
            value:
              type: number
            alpha:
              type: number
            k:
              type: number
            warmupIntervals:
              type: integer
        every:
          type: string
          example: 1m
        forDuration:
          type: string
          example: 5m
        channelIds:
          type: array
          items: *id004
        enabled:
          type: boolean
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleInput'
        - type: object
          properties:
            id: *id004
            nextRunAt: *id005
            createdAt: *id005
    Alert:
      type: object
      properties:
        id: *id004
        ruleId: *id004
        groupKey:
          type: string
        state:
          enum:
            - ok
            - pending
            - firing
            - resolving
            - silenced
        value:
          type: number
        flapping:
          type: boolean
        changedAt: *id005
    NotificationChannel:
      type: object
      required:
        - kind
      properties:
        id: *id004
        name:
          type: string
        kind:
          enum:
            - in_app
            - webhook_outbox
            - email_outbox
        config:
          type: object
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: object
        readAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt: *id005
    OutboxMessage:
      type: object
      properties:
        id:
          type: integer
        channelId: *id004
        dedupKey:
          type: string
        attempts:
          type: integer
        nextAttemptAt: *id005
        deliveredAt:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
    Incident:
      type: object
      properties:
        id: *id004
        title:
          type: string
        status:
          enum:
            - open
            - acknowledged
            - mitigated
            - resolved
        assigneeId:
          type:
            - string
            - 'null'
        openedAt: *id005
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
    IncidentEvent:
      type: object
      properties:
        id:
          type: integer
        kind:
          enum:
            - alert
            - note
            - status
            - search
        data:
          type: object
        actorUserId:
          type:
            - string
            - 'null'
        at: *id005
    RetentionPolicy:
      type: object
      required:
        - retentionDays
      properties:
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
        archiveBeforeDrop:
          type: boolean
    PartitionInfo:
      type: object
      properties:
        name:
          type: string
          example: log_events_p20261124
        day:
          type: string
          format: date
        rows:
          type: integer
        bytes:
          type: integer
        archived:
          type: boolean
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - path: email
                  message: Invalid email
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: UNAUTHENTICATED
              message: Authentication required
    Forbidden:
      description: You do not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
    CsrfInvalid:
      description: Missing or invalid CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: CSRF_INVALID
              message: Missing or invalid CSRF token
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_FOUND
              message: Resource not found
    PayloadTooLarge:
      description: Request body is too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body is too large
    QueryError:
      description: QUERY_INVALID (with lensqlCode and span), QUERY_TIMEOUT or QUERY_FAILED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: QUERY_INVALID
              message: Unknown command 'bogus'; expected stats, sort, head, fields or where
              details:
                lensqlCode: PARSE_ERROR
                span:
                  start: 14
                  end: 19
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next attempt is allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: RATE_LIMITED
              message: Too many attempts; try again later
              details:
                retryAfterSeconds: 2
    NotImplemented:
      description: This operation is planned but not implemented yet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: This operation is planned but not implemented yet
              details:
                ticket: LG-150
