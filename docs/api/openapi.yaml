# LogLens OpenAPI 3.1 contract for the full target API.
# x-status: implemented | pending. Pending operations answer 501 with details.ticket.
openapi: 3.1.0
info:
  title: LogLens API
  version: 0.1.0
  description:
    'Log ingestion, LensQL search and alerting. Every operation carries `x-status: implemented|pending`; pending
    operations are registered and answer 501 NOT_IMPLEMENTED with `details.ticket` (see docs/planning/backlog.md). All responses
    use the `{ data, error, meta? }` envelope.'
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:4109
    description: Local development
tags:
  - name: Platform
  - name: Auth
  - name: API keys
  - name: Ingestion
  - name: Search
  - name: Saved searches
  - name: Dashboards
  - name: Alerting
  - name: Notifications
  - name: Incidents
  - name: Pipelines
  - name: Retention
  - name: Organization
security: &id001
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Platform
      summary: Liveness probe
      x-status: implemented
      security: []
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        const: ok
                      version:
                        type: string
                  error:
                    type: 'null'
  /ready:
    get:
      operationId: getReady
      tags:
        - Platform
      summary: Readiness probe (database reachable and migrated)
      x-status: implemented
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        const: ready
                      database:
                        const: up
                      migrations:
                        type: integer
                  error:
                    type: 'null'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
        - Auth
      summary: Issue (or return) the CSRF double-submit token
      x-status: implemented
      security: []
      responses:
        '200':
          description: Token; also set as the readable ll_csrf cookie
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    required:
                      - csrfToken
                    properties:
                      csrfToken:
                        type: string
                  error:
                    type: 'null'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Register an organization and its owner
      x-status: implemented
      description:
        Does not sign the user in and does not reveal whether the email is already registered. Limited to 5 attempts
        per normalised client IP per hour. Email verification via the local outbox is LG-211.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Always the same generic message whether or not the email exists
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Sign in and receive a session cookie
      x-status: implemented
      description:
        Throttled per email (progressive backoff), per normalised IP (spraying) and by distinct emails per IP.
        Failures return a generic message.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; sets ll_session (HttpOnly, SameSite=Lax) and rotates ll_csrf
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/Me'
                      expiresAt:
                        type: string
                        format: date-time
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: End the current session
      x-status: implemented
      security: &id002
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: Session deleted and cookie cleared
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      loggedOut:
                        const: true
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags:
        - Auth
      summary: Current user, organization, role and permissions
      x-status: implemented
      security: *id001
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      tags:
        - API keys
      summary: List ingestion API keys (requires ingest:keys:read)
      x-status: implemented
      security: *id001
      responses:
        '200':
          description: Keys, newest first (never includes secrets)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createApiKey
      tags:
        - API keys
      summary: Create an ingestion API key (requires ingest:keys:manage)
      x-status: implemented
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Created; the plaintext token is returned only in this response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKeyCreated'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags:
        - API keys
      summary: Revoke an ingestion API key (idempotent)
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: *id002
      responses:
        '200':
          description: Revoked key
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKey'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/ingest:
    post:
      operationId: ingestEvents
      tags:
        - Ingestion
      summary: Ingest log events (NDJSON or JSON)
      x-status: implemented
      description:
        'Authenticated by an ingestion API key; exempt from CSRF. Well-known keys (timestamp/@timestamp/time/ts,
        level/severity/lvl, service/app, host/hostname, message/msg/log, trace_id/traceId, source) become columns; everything
        else is stored in attributes. Limits: INGEST_MAX_EVENTS_PER_REQUEST (default 5000) and INGEST_MAX_BODY_BYTES (default
        5 MiB).'
      security:
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: One JSON object per line; blank lines ignored
            example:
              '{"level":"error","service":"checkout","message":"upstream timeout","http":{"status":504}}

              {"level":"info","message":"ok"}'
          application/jsonl:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RawEvent'
                - type: array
                  items:
                    $ref: '#/components/schemas/RawEvent'
                  maxItems: 5000
      responses:
        '202':
          description: Batch stored; per-line rejections reported
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/IngestResult'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/search:
    post:
      operationId: search
      tags:
        - Search
      summary: Run a LensQL query
      x-status: implemented
      description:
        Compiled to one parameterised statement executed in a READ ONLY transaction with a statement timeout (QUERY_TIMEOUT_MS,
        default 5000).
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Events or a statistics table
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/SearchResponse'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/QueryError'
  /api/v1/search/histogram:
    post:
      operationId: searchHistogram
      tags:
        - Search
      summary: Event counts over time for the search part of a query
      x-status: implemented
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistogramRequest'
      responses:
        '200':
          description: Dense, gap-free buckets
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/HistogramResponse'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/QueryError'
  /api/v1/search/validate:
    post:
      operationId: validateQuery
      tags:
        - Search
      summary: Parse and analyse a query without executing it
      x-status: implemented
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              additionalProperties: false
              properties:
                query:
                  type: string
                  maxLength: 4000
      responses:
        '200':
          description: Validation result (invalid queries still return 200)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/ValidateResponse'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
        - Auth
      summary: Verify a signup email with a token from the local outbox
      x-status: pending
      x-ticket: LG-211
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-211.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags:
        - Auth
      summary: Request or complete a password reset via the local outbox
      x-status: pending
      x-ticket: LG-210
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-210.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '202':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                  error:
                    type: 'null'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/organization:
    get:
      operationId: getOrganization
      tags:
        - Organization
      summary: Organization settings
      x-status: pending
      x-ticket: LG-215
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-215.
      security: *id001
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
    patch:
      operationId: updateOrganization
      tags:
        - Organization
      summary: Update organization settings
      x-status: pending
      x-ticket: LG-215
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-215.
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/members:
    get:
      operationId: listMembers
      tags:
        - Organization
      summary: List members and roles
      x-status: pending
      x-ticket: LG-200
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-200.
      security: *id001
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/invitations:
    post:
      operationId: createInvitation
      tags:
        - Organization
      summary: Invite a member by email (delivered via the local outbox)
      x-status: pending
      x-ticket: LG-201
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-201.
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/members/{userId}:
    patch:
      operationId: updateMember
      tags:
        - Organization
      summary: Change a member's role (last owner protected)
      x-status: pending
      x-ticket: LG-202
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-202.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags:
        - Organization
      summary: Browse the audit trail
      x-status: pending
      x-ticket: LG-205
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-205.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      security: *id001
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  error:
                    type: 'null'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/ingest/syslog:
    post:
      operationId: ingestSyslog
      tags:
        - Ingestion
      summary: Ingest RFC 5424 syslog lines (RFC 3164 fallback LG-111)
      x-status: pending
      x-ticket: LG-110
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-110.
      security: *id002
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '202':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/IngestResult'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/ingest/quota:
    get:
      operationId: getIngestQuota
      tags:
        - Ingestion
      summary: Current ingestion quota and usage
      x-status: pending
      x-ticket: LG-112
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-112.
      security: *id001
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/IngestQuota'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/pipelines:
    get:
      operationId: listPipelines
      tags:
        - Pipelines
      summary: List field extraction pipelines
      x-status: pending
      x-ticket: LG-120
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-120.
      security: *id001
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pipeline'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createPipeline
      tags:
        - Pipelines
      summary: Create a field extraction pipeline
      x-status: pending
      x-ticket: LG-120
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-120.
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeline'
      responses:
        '201':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Pipeline'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/pipelines/test:
    post:
      operationId: testPipeline
      tags:
        - Pipelines
      summary: Dry-run a pipeline against sample lines
      x-status: pending
      x-ticket: LG-122
      description: Not implemented yet; currently answers 501 NOT_IMPLEMENTED with details.ticket = LG-122.
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pipeline
                - samples
              properties:
                pipeline:
                  $ref: '#/components/schemas/Pipeline'
                samples:
                  type: array
                  items:
                    type: string
                  maxItems: 100
      responses:
        '200':
          description: Target response once implemented
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        input:
                          type: string
                        output:
                          $ref: '#/components/schemas/RawEvent'
                        error:
                          type:
                            - string
                            - 'null'
                  error:
